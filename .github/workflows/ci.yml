name: Checks

# Runs on every push and pull request: type safety and the unit suite that
# covers form validation, formatting and the rate limiter. No database or
# secrets are needed, so a red build always means broken code, not missing
# configuration.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
